<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscrição realizada - Eventos CRF-PB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 680px;">
        <section class="bg-white rounded shadow-sm p-4 p-md-5 text-center">
            <div class="text-success display-4" aria-hidden="true">&#10003;</div>
            <h1 class="h2 mt-3">Inscrição realizada</h1>
            <p class="text-muted">Sua inscrição no evento <strong>{{ evento.titulo }}</strong> foi registrada.</p>
            <a href="{% url 'eventos:lista' %}" class="btn btn-primary">Ver outros eventos</a>
        </section>
    </main>
</body>
</html>
